    <rect x="6" y="6" width="112" height="112" fill="#000000"/>
    <rect x="0" y="0" width="112" height="112" fill="#e10600" stroke="#000" stroke-width="6"/>
    <text x="56" y="82" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="78" font-weight="700" fill="#ffffff">R</text>
